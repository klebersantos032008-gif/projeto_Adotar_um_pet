<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adote um Pet</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <a href="inicio.html" class="logo">Adote um Pet</a>
        <nav class="menu">
        <ul>
            <li><a href="inicio.html">Início</a></li>
            <li><a href="pets.html">Pets</a></li>
            <li><a href="comoadotar.html">Como adotar</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
        </nav>
        <button type="button" id="btn-modo" class="btn-modo">🌙</button>
    </header>

    <main>
    <section id="contato" class="contato">
      <h2>Quero adotar</h2>

      <form id="form-adocao" action="#" method="post">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" required>

        <label for="pet">Pet de interesse</label>
        <select id="pet" name="pet" required>
          <option value="thor">Thor</option>
          <option value="mia">Mia</option>
          <option value="bruce">Bruce</option>
          <option value="bilu">Bilu</option>
          <option value="filo">Filó</option>
          <option value="relampago">Relâmpago</option>
        </select>

        <label for="moradia">Tipo de moradia</label>
        <select id="moradia" name="moradia" required>
          <option value="">Selecione</option>
          <option value="casa">Casa</option>
          <option value="apartamento">Apartamento</option>
        </select>

        <label for="mensagem">Por que você quer adotar?</label>
        <textarea id="mensagem" name="mensagem" rows="4"></textarea>

        <label class="check">
          <input type="checkbox" id="termo" name="termo" required>
          Concordo em cuidar do animal com responsabilidade.
        </label>

        <button type="submit" class="botao">Enviar pedido</button>
      </form>
    </section>
    </main>
    
    <footer class="rodape">
    <p>&copy; 2026 Adote um Pet. Todos os direitos reservados.</p>
    <p>contato@adoteumpet.com · (11) 99999-9999</p>
    </footer>
</body>
</html>
