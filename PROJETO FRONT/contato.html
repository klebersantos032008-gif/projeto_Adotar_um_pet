<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quero adotar | Adote um Pet</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <a href="inicio.html" class="logo">Adote um Pet</a>
        <nav class="menu">
        <ul>
            <li><a href="inicio.html">Início</a></li>
            <li><a href="pets.html">Pets</a></li>
            <li><a href="comoadotar.html">Como adotar</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
        </nav>
        <div class="acoes-cabecalho">
        <div class="controles-acessibilidade" role="group" aria-label="Ferramentas de acessibilidade">
          <button type="button" data-fonte="diminuir" aria-label="Diminuir tamanho do texto">A−</button>
          <button type="button" data-fonte="aumentar" aria-label="Aumentar tamanho do texto">A+</button>
          <button type="button" id="btn-contraste" aria-pressed="false">Alto contraste</button>
        </div>
        <label class="btn-modo" title="Alternar entre modo claro e escuro"><input type="checkbox" id="btn-modo" role="switch" aria-label="Alternar entre modo claro e escuro"><span class="icone-modo icone-sol" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg></span><span class="icone-modo icone-lua" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"></path><path d="m17 3 .6 1.7L19.3 5.3l-1.7.6L17 7.6l-.6-1.7-1.7-.6 1.7-.6L17 3Zm3 6 .4 1.1 1.1.4-1.1.4L20 12l-.4-1.1-1.1-.4 1.1-.4L20 9Z"></path></svg></span><span class="trilho-modo" aria-hidden="true"></span></label>
</div>
    </header>

    <main>
    <section id="contato" class="contato">
      <h2>Quero adotar</h2>

      <form id="form-adocao" method="post">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" required>

        <label for="pet">Pet de interesse</label>
        <select id="pet" name="pet" required>
          <option value="">Selecione um pet</option>
          <option value="thor">Thor</option>
          <option value="mia">Mia</option>
          <option value="bruce">Bruce</option>
          <option value="bilu">Bilu</option>
          <option value="filo">Filó</option>
          <option value="relampago">Relâmpago</option>
        
          <option value="sol">Sol</option>
          <option value="jade">Jade</option>
          <option value="pecinha">Pecinha</option>
          <option value="pitucho">Pitucho</option>
          <option value="zoom">Zoom</option>
          <option value="bela">Bela</option>
          <option value="rex">Rex</option>
          <option value="mel">Mel</option>
          <option value="chefe">Chefe</option>
        </select>

        <label for="moradia">Tipo de moradia</label>
        <select id="moradia" name="moradia" required>
          <option value="">Selecione</option>
          <option value="casa">Casa</option>
          <option value="apartamento">Apartamento</option>
        </select>

        <label for="mensagem">Por que você quer adotar?</label>
        <textarea id="mensagem" name="mensagem" rows="4"></textarea>

        <label class="check">
          <input type="checkbox" id="termo" name="termo" required>
          Concordo em cuidar do animal com responsabilidade.
        </label>

        <button type="submit" class="botao">Enviar pedido</button>
      </form>
      <p id="confirmacao-formulario" class="mensagem-confirmacao" role="status" aria-live="polite" hidden></p>
    </section>
    </main>
    
    <footer class="rodape">
    <p>&copy; 2026 Adote um Pet. Todos os direitos reservados.</p>
    <p class="aviso-prototipo">Projeto acadêmico demonstrativo · informações fictícias</p>
    <p>contato@adoteumpet.com · (11) 99999-9999</p>
    </footer>
</body>
</html>
